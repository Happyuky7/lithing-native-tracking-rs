[package]
name = "lithing-tracking-cli"
description = "Runs and benchmarks lithing-tracking on a camera or a video file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lithing-track"
path = "src/main.rs"

[features]
default = ["camera", "directml"]
camera = ["lithing-tracking/camera"]
directml = ["lithing-tracking/directml"]
cuda = ["lithing-tracking/cuda"]

[dependencies]
lithing-tracking = { workspace = true, default-features = false, features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }
