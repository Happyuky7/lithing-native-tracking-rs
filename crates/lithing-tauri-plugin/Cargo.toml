[package]
name = "tauri-plugin-lithing-tracking"
description = "Tauri 2 plugin: native lithing-tracking, streamed to the web view over a Channel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
links = "tauri-plugin-lithing-tracking"

[lib]
name = "tauri_plugin_lithing_tracking"

[features]
default = ["camera", "directml"]
camera = ["lithing-tracking/camera"]
directml = ["lithing-tracking/directml"]
cuda = ["lithing-tracking/cuda"]
# Android: the NNAPI provider (`provider: "nnapi"`; Auto stays on the CPU).
nnapi = ["lithing-tracking/nnapi"]
# Load ONNX Runtime from a shared library at run time (the app bundles it on Linux)
# instead of linking the static build `ort` downloads.
load-dynamic = ["lithing-tracking/load-dynamic"]

[dependencies]
lithing-tracking = { workspace = true, default-features = false, features = ["serde"] }
tauri = { version = "2.11", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Android: frames arrive from the Kotlin camera through JNI (the version tauri uses).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }
